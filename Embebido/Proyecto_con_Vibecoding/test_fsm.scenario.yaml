name: smoke-fsm-puerta
version: 1
author: Claude Code

# Smoke test de la FSM única:
#  - arranque + conexión WiFi (Wokwi-GUEST)
#  - loop de detección de luz corriendo
#  - simular NOCHE (poca luz) -> EV_NOCHE_DETECTADA -> ACC_ENCENDER_LUZ
#  - simular DÍA (mucha luz)  -> EV_DIA_DETECTADO   -> ACC_APAGAR_LUZ
steps:
  - wait-serial: "WiFi Conectado"
  - wait-serial: "[luz_deteccion] ADC="

  # Noche: bajar la luz por debajo del umbral (ADC < 2048)
  - set-control:
      part-id: ldr1
      control: lux
      value: 0
  - wait-serial: "Transición iniciada: Luz encendida"

  # Día: subir la luz por encima del umbral
  - set-control:
      part-id: ldr1
      control: lux
      value: 1000
  - wait-serial: "Transición iniciada: Luz apagada"
