; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================================
; Configuracion base — todos los envs heredan de esta.
; ============================================================================
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; OTA necesita 2 particiones app (app0 + app1) para poder escribir la nueva
; imagen mientras corre la actual. min_spiffs.csv da 1.9 MB por particion
; (vs 1.2 MB del default), suficiente para nuestro firmware con WiFi +
; ArduinoJson + MFRC522 + PubSubClient + Update + HTTPClient.
board_build.partitions = min_spiffs.csv

lib_deps =
  madhephaestus/ESP32Servo
  miguelbalboa/MFRC522@^1.4.10
  knolleary/PubSubClient@^2.8.0 # Revisar esta versión
  bblanchon/ArduinoJson@^7.0.0

; ============================================================================
; env:esp32dev (DEFAULT) — version actual (v1.1.0) con La Cucaracha.
; Es lo que vas a subir a S3 y descargar por OTA durante la demo.
;   pio run                  -> compila firmware.bin (v1.1.0)
;   pio run -t upload        -> flashea por USB (uso normal de desarrollo)
;   pio device monitor -e esp32dev   -> serial a 115200 (los Serial.println)
; ============================================================================
[env:esp32dev]
monitor_speed = 115200
build_flags = -DFW_VERSION_OVERRIDE='"1.1.0"'

; ============================================================================
; env:esp32_v100 — version "vieja" (v1.0.0) con BEEP SIMPLE.
; Esta version se flashea POR USB UNA VEZ antes de la demo, para que el
; estado inicial del dispositivo sea "v1.0.0 con beep". Despues, vivo en la
; presentacion, se dispara la OTA y el ESP32 se actualiza a v1.1.0.
;   pio run -e esp32_v100 -t upload   -> flashea v1.0.0 por USB
;   pio device monitor -e esp32_v100  -> serial a 115200
; ============================================================================
[env:esp32_v100]
monitor_speed = 115200
build_flags =
  -DFW_VERSION_OVERRIDE='"1.0.0"'
  -DBEEP_SIMPLE